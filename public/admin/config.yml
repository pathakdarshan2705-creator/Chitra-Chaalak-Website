backend:
  name: github
  repo: pathakdarshan2705-creator/Chitra-Chaalak-Website

media_folder: /public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog
    folder: /src/content/blog
    create: true

    fields:
      - name: title
        label: Title
        widget: string

      - name: date
        label: Date
        widget: datetime
        type: date

      - name: topic
        label: Topic
        widget: string

      - name: image
        label: Image
        widget: image

      - name: imageAlt
        label: Image Alt
        widget: string
        required: false

      - name: excerpt
        label: Excerpt
        widget: text
        required: false

      - name: body
        label: Content
        widget: richtext